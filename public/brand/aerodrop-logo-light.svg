    <rect width="48" height="48" rx="14" fill="url(#lightAeroBg)" stroke="rgba(2,132,199,0.2)" stroke-width="1.2"/>
    <path d="M10 36 A20 20 0 0 1 36 10" stroke="rgba(255,255,255,0.4)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 3"/>
    <path d="M9 34 C 14 28, 20 18, 34 9" stroke="url(#lightAeroBeam)" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Aircraft -->
    <g transform="translate(24 24) rotate(45) translate(-12 -12)">
      <path d="M12 1.5 C 11.2 3, 10.6 7, 10.5 10 L 1.5 15.5 C 0.8 16, 0.7 16.5, 1 17 L 2.4 18 L 10.1 16.2 L 9.8 21 L 6.8 23.2 L 7.2 24.2 L 12 23 L 16.8 24.2 L 17.2 23.2 L 14.2 21 L 13.9 16.2 L 21.6 18 L 23 17 C 23.3 16.5, 23.2 16, 22.5 15.5 L 13.5 10 C 13.4 7, 12.8 3, 12 1.5 Z" 
