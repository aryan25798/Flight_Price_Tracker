      <rect x="6" y="14.5" width="1.5" height="3.5" rx="0.75" fill="#bae6fd"/>
      <rect x="16.5" y="14.5" width="1.5" height="3.5" rx="0.75" fill="#bae6fd"/>
    </g>
    <circle cx="34" cy="9" r="2" fill="#ffffff"/>
  </g>

  <!-- Typography -->
