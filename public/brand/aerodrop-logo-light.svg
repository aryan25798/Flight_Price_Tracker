    </text>
    <text x="0.5" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', Roboto, sans-serif" font-size="8.5" font-weight="600" letter-spacing="2" fill="#64748b">
