<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Deep atmospheric midnight gradient -->
    <linearGradient id="aeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <!-- Supersonic trajectory glow -->
    <linearGradient id="aeroBeam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>

    <!-- Wing shadow / aerodynamic winglet accent -->
    <linearGradient id="wingShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Precision Squircle Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#aeroBg)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>

  <!-- Subtly Etched Radar Grid Arc -->
  <path d="M14 48 A26 26 0 0 1 48 14" stroke="#0284c7" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.6"/>
  <path d="M20 48 A20 20 0 0 1 48 20" stroke="#38bdf8" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="1.5 2.5" opacity="0.4"/>

  <!-- Aerodynamic Trajectory Vector Beam -->
  <path d="M12 44 C 18 36, 26 24, 44 12" stroke="url(#aeroBeam)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- High-Precision Commercial Airliner (Banking 45 deg) -->
  <g transform="translate(32 32) rotate(45) translate(-16 -16)">
    <!-- Fuselage Body -->
    <path d="M16 2 C 15 4, 14.2 9, 14 13 L 2 20.5 C 1.2 21, 1 21.6, 1.4 22.2 L 3.2 23.4 L 13.5 21.5 L 13 27.5 L 9 30.5 L 9.5 32 L 16 30.5 L 22.5 32 L 23 30.5 L 19 27.5 L 18.5 21.5 L 28.8 23.4 L 30.6 22.2 C 31 21.6, 30.8 21, 30 20.5 L 18 13 C 17.8 9, 17 4, 16 2 Z" 
          fill="url(#wingShadow)" 
          stroke="#f8fafc" 
          stroke-width="0.3"/>
    
    <!-- Left Engine Nacelle -->
    <rect x="8" y="19" width="2" height="4.5" rx="1" fill="#38bdf8"/>
    <!-- Right Engine Nacelle -->
    <rect x="22" y="19" width="2" height="4.5" rx="1" fill="#38bdf8"/>
    
    <!-- Cockpit Windshield -->
    <path d="M15 6.5 Q 16 5.8 17 6.5 L 17 8 L 15 8 Z" fill="#0284c7"/>
  </g>

  <!-- Flight Target Beacon (Live Ping) -->
  <circle cx="44" cy="12" r="2.5" fill="#38bdf8"/>
  <circle cx="44" cy="12" r="5" stroke="#38bdf8" stroke-width="0.75" opacity="0.6"/>
</svg>